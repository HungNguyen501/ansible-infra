---
name: Ansible Check

# Dry run: --check --diff. Changes nothing. The run id of a successful check is the input of Ansible Apply.
# Tasks that write secrets into files must set diff: false, or the value lands in the summary and the artifact.
# run-name is compared by Ansible Apply, so an apply can only follow a check made with the same inputs.
run-name: "Check ${{ inputs.environment }} | ${{ inputs.playbook }} | limit=${{ inputs.limit }} | tags=${{ inputs.tags }} | skip=${{ inputs.skip_tags }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: ["staging", "production"]
        required: true
      playbook:
        description: Playbook path under playbooks/
        type: string
        default: playbooks/site.yml
        required: true
      limit:
        description: Host limit (--limit), empty for all hosts
        type: string
        default: ""
      tags:
        description: Run only these tags, comma-separated
        type: string
        default: ""
      skip_tags:
        description: Skip these tags, comma-separated
        type: string
        default: ""

permissions:
  contents: read

# One run per environment at a time, so a check never overlaps an apply.
concurrency:
  group: ansible-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  check:
    name: "Check ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC to AWS for the SSM connection
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible
        with:
          vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          environment: ${{ inputs.environment }}

      - name: Set up AWS access for SSM
        uses: ./.github/actions/setup-aws-ssm
        with:
          environment: ${{ inputs.environment }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}

      - name: Check out the Agentic Slack Bot
        uses: ./.github/actions/checkout-slack-bot
        with:
          environment: ${{ inputs.environment }}

      - name: Configure SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          (umask 077 && printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519")
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ANSIBLE_SSH_KNOWN_HOSTS }}

      - name: Run check
        run: scripts/run-playbook.sh 2>&1 | tee check-output.txt
        shell: bash
        env:
          MODE: check
          ENVIRONMENT: ${{ inputs.environment }}
          PLAYBOOK: ${{ inputs.playbook }}
          LIMIT: ${{ inputs.limit }}
          TAGS: ${{ inputs.tags }}
          SKIP_TAGS: ${{ inputs.skip_tags }}

      - name: Add the diff to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '```text'
            tail -c 60000 check-output.txt || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: check-output-${{ inputs.environment }}
          path: check-output.txt
          if-no-files-found: ignore
          retention-days: 7 # the diff may hold rendered values; keep it short

      - name: Remove secrets from the runner
        if: always()
        shell: bash
        run: rm -rf "${HOME}/.vault" "${HOME}/.ssh/id_ed25519"
