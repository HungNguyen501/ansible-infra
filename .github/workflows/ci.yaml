---
name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Runs on master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether Molecule has anything to test. A job-level condition, not paths-ignore on the workflow: a skipped job
  # counts as passing for a required status check, while a workflow skipped by paths-ignore leaves the check pending.
  # Lint always runs: its whitespace hooks and the secret scan cover markdown too.
  changes:
    name: "Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the action lists the files of a pull request through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # a push event reads the git history, a pull request does not need it

      # Any file that is not markdown, or any file of a Molecule scenario: the scenarios use .md files as test fixtures.
      # A rename counts as a delete plus an add, so moving a role file to a .md name is still a change.
      - name: Look for changes other than documentation
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            code:
              - '!**/*.md'
              - 'roles/*/molecule/**'

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the full history

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible

      # Runs the same hooks as developers do locally: whitespace, private keys, vault files encrypted, make lint.
      - name: Pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Syntax check
        run: make syntax

      - name: Secret scan
        run: make scan

  molecule:
    name: "Molecule"
    needs: changes
    # If the Changes job fails, run the tests: a skipped Molecule would pass a required check on a broken filter.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ansible
        uses: ./.github/actions/setup-ansible
        with:
          test-tools: "true"

      - name: Molecule tests
        run: make test
