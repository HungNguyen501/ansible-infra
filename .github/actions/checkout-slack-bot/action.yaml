---
name: Check out the Agentic Slack Bot
description: Check out the agentic-slack-bot revision that matches the image tag of the target environment, and point the slack_bot_deploy role at it.
inputs:
  environment:
    description: Target environment. Its slack_bot_deploy_image_tag picks the revision. Nothing is checked out when it has no slack_bot group vars.
    required: true
  repository:
    description: GitHub repository of the application.
    required: false
    default: HungNguyen501/agentic-slack-bot
  token:
    description: Token that can read the repository. The default github.token reaches this repository only. Pass a PAT or app token if the application repository turns private.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # The image tag vYYYY.MM.DD.<sha> is also a git tag of the application, prefixed with agentic-slack-bot-.
    # Deploying the compose file and skills of the revision that built the image keeps all three in step.
    - name: Resolve the application revision
      id: revision
      shell: bash
      run: |
        set -euo pipefail
        [[ "${ENVIRONMENT}" =~ ^[a-z][a-z0-9]*$ ]] || { echo "error: invalid environment" >&2; exit 1; }
        vars_file="inventories/${ENVIRONMENT}/group_vars/slack_bot/vars.yml"
        if [ ! -f "${vars_file}" ]; then
          echo "No slack_bot group vars in ${ENVIRONMENT}: nothing to check out."
          exit 0
        fi
        tag="$(sed -nE 's/^slack_bot_deploy_image_tag:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' "${vars_file}")"
        [[ "${tag}" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9a-f]+$ ]] || { echo "error: cannot read slack_bot_deploy_image_tag from ${vars_file}" >&2; exit 1; }
        echo "ref=refs/tags/agentic-slack-bot-${tag}" >> "${GITHUB_OUTPUT}"
        echo "sha=${tag##*.}" >> "${GITHUB_OUTPUT}"
      env:
        ENVIRONMENT: ${{ inputs.environment }}

    - name: Check out the application
      if: steps.revision.outputs.ref != ''
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.revision.outputs.ref }}
        path: agentic-slack-bot
        token: ${{ inputs.token }}
        persist-credentials: false

    # The tag is mutable, but the image tag ends in the short commit id the image was built from. Refuse a tag that moved.
    - name: Verify the checkout is the commit of the image tag
      if: steps.revision.outputs.ref != ''
      shell: bash
      run: |
        set -euo pipefail
        head="$(git -C agentic-slack-bot rev-parse HEAD)"
        case "${head}" in
          "${EXPECTED_SHA}"*) echo "agentic-slack-bot checked out at ${head}" ;;
          *) echo "error: tag ${REF} points at ${head}, not at a commit starting with ${EXPECTED_SHA}" >&2; exit 1 ;;
        esac
      env:
        EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        REF: ${{ steps.revision.outputs.ref }}

    - name: Point the role at the checkout
      if: steps.revision.outputs.ref != ''
      shell: bash
      run: echo "SLACK_BOT_SRC_DIR=${GITHUB_WORKSPACE}/agentic-slack-bot" >> "${GITHUB_ENV}"
