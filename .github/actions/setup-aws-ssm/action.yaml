---
name: Set up AWS access for SSM
description: Assume an AWS role through GitHub OIDC and install the Session Manager plugin, so Ansible can reach hosts over amazon.aws.aws_ssm.
inputs:
  environment:
    description: Target environment. Its inventory tells whether it has SSM hosts and which region they are in.
    required: true
  role-arn:
    description: IAM role to assume. May be empty for an environment with no SSM hosts. The calling job needs permissions id-token write.
    required: false
    default: ""
  region:
    description: Region used when the inventory of the environment sets none.
    required: false
    default: us-east-1
runs:
  using: composite
  steps:
    # Decide from the effective host variables, as Ansible resolves them, not from how the YAML is written: quoting,
    # indentation, host or group level all count. The inventory output holds decrypted vault values, so it goes straight
    # into a script that prints two words and nothing else.
    - name: Resolve the SSM settings from the inventory
      id: ssm
      shell: bash
      run: |
        set -euo pipefail
        [[ "${ENVIRONMENT}" =~ ^[a-z][a-z0-9]*$ ]] || { echo "error: invalid environment" >&2; exit 1; }
        dir="inventories/${ENVIRONMENT}"
        [ -d "${dir}" ] || { echo "error: no inventory directory ${dir}" >&2; exit 1; }
        password_file="${HOME}/.vault/ansible-infra_${ENVIRONMENT}"
        if [ -f "${password_file}" ]; then
          export ANSIBLE_VAULT_PASSWORD_FILE="${password_file}"
        fi
        ssm="$(ansible-inventory -i "${dir}" --list | python3 -I -c '
        import json, os, sys
        hosts = json.load(sys.stdin)["_meta"]["hostvars"]
        default = os.environ["DEFAULT_REGION"]
        regions = {v.get("ansible_aws_ssm_region") or default for v in hosts.values() if v.get("ansible_connection") == "amazon.aws.aws_ssm"}
        if len(regions) > 1:
            sys.exit("error: the SSM hosts use several regions (" + ", ".join(sorted(regions)) + "), this action configures one")
        print("true" if regions else "false", next(iter(regions), ""))
        ')"
        read -r needed region <<< "${ssm}"
        if [ "${needed}" = "true" ]; then
          if [ -z "${ROLE_ARN}" ]; then
            echo "error: ${ENVIRONMENT} has SSM hosts, but the AWS_ROLE_ARN variable of the ${ENVIRONMENT} environment is not set" >&2
            exit 1
          fi
          echo "needed=true" >> "${GITHUB_OUTPUT}"
          echo "region=${region}" >> "${GITHUB_OUTPUT}"
        else
          echo "No SSM hosts in ${ENVIRONMENT}: skipping the AWS setup."
        fi
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ROLE_ARN: ${{ inputs.role-arn }}
        DEFAULT_REGION: ${{ inputs.region }}

    - name: Assume the AWS role
      if: steps.ssm.outputs.needed == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ steps.ssm.outputs.region }}

    # Pinned by version and checked by hash: the plugin runs on the runner next to the AWS credentials.
    - name: Install the Session Manager plugin
      if: steps.ssm.outputs.needed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        deb="${RUNNER_TEMP}/session-manager-plugin.deb"
        curl -fsSL -o "${deb}" "https://s3.amazonaws.com/session-manager-downloads/plugin/${PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb"
        echo "${PLUGIN_SHA256}  ${deb}" | sha256sum --check --strict -
        sudo dpkg -i "${deb}"
        session-manager-plugin --version
      env:
        PLUGIN_VERSION: 1.2.896.0
        PLUGIN_SHA256: 53f51fcc67314a4bf85888a38a3967cd41f8d0f28a60a9469a63acf935ba713e
