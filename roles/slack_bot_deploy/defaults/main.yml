---
# Directory on the host that holds the compose files.
slack_bot_deploy_dir: /var/workspace/agentic-slack-bot

# Local checkout of the agentic-slack-bot repository. Its docker-compose.yml is copied to the host.
# The SLACK_BOT_SRC_DIR environment variable overrides the sibling checkout. The deploy workflows set it.
slack_bot_deploy_src_dir: "{{ lookup('ansible.builtin.env', 'SLACK_BOT_SRC_DIR') | default(playbook_dir ~ '/../../agentic-slack-bot', true) }}"

# Compose services started by a deploy and restarted by the restart tag.
slack_bot_deploy_services:
  - redis
  - receiver
  - worker
  - scheduler
  - ngrok

# Number of worker containers (WORKER_COUNT in docker-compose.yml).
slack_bot_deploy_worker_count: 2

# Non-secret environment of the compose project, as NAME: value. Used to fill the ${NAME} references in docker-compose.yml.
slack_bot_deploy_env: {}
