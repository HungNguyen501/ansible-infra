---
- name: Stop | Stop services and remove orphan containers
  block:
    - name: Stop | Write the environment file
      ansible.builtin.import_tasks: env_write.yml

    - name: Stop | Run docker compose down
      community.docker.docker_compose_v2:
        project_src: "{{ slack_bot_deploy_dir }}"
        files: "{{ __slack_bot_deploy_compose_files }}"
        state: absent
        remove_orphans: true
      become: true
  always:
    - name: Stop | Remove the environment file
      ansible.builtin.import_tasks: env_remove.yml
