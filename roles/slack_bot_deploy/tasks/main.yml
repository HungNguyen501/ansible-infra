---
- name: Slack bot deploy | Stage compose files
  ansible.builtin.import_tasks: stage.yml

# Own tag so skill edits go live without a deploy: make deploy ENV=<env> TAGS=skills
- name: Slack bot deploy | Sync worker skills
  ansible.builtin.import_tasks: skills.yml
  tags:
    - skills

- name: Slack bot deploy | Start services
  ansible.builtin.import_tasks: compose.yml

# never: runs only with TAGS=restart, so a full deploy does not restart twice.
- name: Slack bot deploy | Restart services
  ansible.builtin.import_tasks: restart.yml
  tags:
    - never
    - restart
