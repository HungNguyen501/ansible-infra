---
# ansible.posix.synchronize cannot mirror a directory here: it needs rsync over SSH, and the hosts are reached through SSM.
# So the role compares the deployed tree with the source before it copies:
#   - an entry the source no longer has is removed, or it would stay live for the workers
#   - an entry that is a file in one tree and a directory in the other is removed, or copy fails or writes into it
- name: Skills | Read the tree of the source checkout
  ansible.builtin.set_fact:
    __slack_bot_deploy_skills_tree: >-
      {{ query('community.general.filetree', slack_bot_deploy_src_dir ~ '/src/worker/skills/') | list }}

# copy follows a symlink and writes a regular file, which the next run would then treat as stale and recreate.
- name: Skills | Assert the source tree holds no symlink
  ansible.builtin.assert:
    that: __slack_bot_deploy_skills_tree | selectattr('state', 'equalto', 'link') | list | length == 0
    fail_msg: >-
      The skills source holds symlinks, which are not supported:
      {{ __slack_bot_deploy_skills_tree | selectattr('state', 'equalto', 'link') | map(attribute='path') | join(', ') }}

- name: Skills | List the source entries as <type>:<relative path>
  ansible.builtin.set_fact:
    __slack_bot_deploy_skills_keep: >-
      {{ (__slack_bot_deploy_skills_tree | map(attribute='state') | list)
      | zip(__slack_bot_deploy_skills_tree | map(attribute='path') | list) | map('join', ':') | list }}

# An empty source means a broken checkout (uninitialised submodule, sparse checkout), not a request to delete every skill.
- name: Skills | Assert the source holds skills
  ansible.builtin.assert:
    that: __slack_bot_deploy_skills_keep | length > 0
    fail_msg: "{{ slack_bot_deploy_src_dir }}/src/worker/skills/ is empty. Refusing to prune the deployed skills."

- name: Skills | Find the deployed skills
  ansible.builtin.find:
    paths: "{{ slack_bot_deploy_dir }}/src/worker/skills"
    file_type: any
    recurse: true
    hidden: true
  become: true
  register: slack_bot_deploy_skills_found

# Entries are compared as <type>:<relative path>, so a path whose type changed is as stale as one that is gone.
- name: Skills | List the deployed skills that the source does not have as they are
  ansible.builtin.set_fact:
    __slack_bot_deploy_skills_stale: >-
      {{ (slack_bot_deploy_skills_found.files | map(attribute='isdir') | map('ternary', 'directory', 'file') | list)
      | zip(slack_bot_deploy_skills_found.files | map(attribute='path')
      | map('relpath', slack_bot_deploy_dir ~ '/src/worker/skills') | list)
      | map('join', ':') | list | difference(__slack_bot_deploy_skills_keep)
      | map('regex_replace', '^(file|directory):', '') | list }}

# Entries that exist in both trees with another type. Check mode does not delete them, so copy would fail on them.
- name: Skills | List the entries that changed between file and directory
  ansible.builtin.set_fact:
    __slack_bot_deploy_skills_swapped: >-
      {{ __slack_bot_deploy_skills_stale
      | intersect(__slack_bot_deploy_skills_keep | map('regex_replace', '^(file|directory):', '') | list) }}

# Only the topmost stale entry of each tree is removed: deleting a directory takes its children with it.
- name: Skills | Remove the stale skills
  ansible.builtin.file:
    path: "{{ slack_bot_deploy_dir }}/src/worker/skills/{{ item }}"
    state: absent
  loop: "{{ __slack_bot_deploy_skills_stale }}"
  when: (item | dirname) not in __slack_bot_deploy_skills_stale
  become: true

- name: Skills | Report the copy that check mode cannot preview
  ansible.builtin.debug:
    msg: >-
      Check mode removes nothing, so the copy is skipped. These skills change between file and directory
      and are replaced by a real run: {{ __slack_bot_deploy_skills_swapped | join(', ') }}
  when: ansible_check_mode and __slack_bot_deploy_skills_swapped | length > 0

- name: Skills | Copy the worker skills directory
  when: not (ansible_check_mode and __slack_bot_deploy_skills_swapped | length > 0)
  ansible.builtin.copy:
    src: "{{ slack_bot_deploy_src_dir }}/src/worker/skills/"
    dest: "{{ slack_bot_deploy_dir }}/src/worker/skills/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  become: true
