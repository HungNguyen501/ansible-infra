---
# required: true in argument_specs catches a missing slack_bot_deploy_secret_env, not an empty one.
- name: Compose | Assert the secret environment is set
  ansible.builtin.assert:
    that: slack_bot_deploy_secret_env | length > 0
    fail_msg: slack_bot_deploy_secret_env is empty. Alias the vault_* variables in the inventory.

- name: Compose | Assert no placeholder value is left in the environment
  ansible.builtin.assert:
    that:
      - "'replace-me' not in (__slack_bot_deploy_compose_env.values() | list)"
    fail_msg: An environment value is still the replace-me placeholder. Set it with make vault-edit.
  no_log: true

# docker compose cannot be dry run before the files are staged, so check mode shows the staged diff only.
# The environment file with the secrets exists on the host only while compose runs, and is removed even when compose fails.
# The module result holds container state and compose output, no values, so it is not hidden: a failed deploy shows why.
# A parse error of the environment file can quote a fragment of a line, which the checks in env_write.yml rule out for
# the known causes (single quote, trailing backslash, carriage return).
- name: Compose | Start services from the pre-built image
  when: not ansible_check_mode
  block:
    - name: Compose | Write the environment file
      ansible.builtin.import_tasks: env_write.yml

    - name: Compose | Start the services
      community.docker.docker_compose_v2:
        project_src: "{{ slack_bot_deploy_dir }}"
        files: "{{ __slack_bot_deploy_compose_files }}"
        services: "{{ slack_bot_deploy_services }}"
        state: present
        pull: missing
        build: never
        recreate: auto
        wait: true
        wait_timeout: 120
        env_files:
          - "{{ __slack_bot_deploy_env_file }}"
      become: true
      register: slack_bot_deploy_compose_result
      # One retry for a pull that fails on a brief network or registry error. Starting the services again is idempotent.
      retries: 1
      delay: 10
      until: slack_bot_deploy_compose_result is succeeded
  always:
    - name: Compose | Remove the environment file
      ansible.builtin.import_tasks: env_remove.yml

- name: Compose | Show service state
  ansible.builtin.debug:
    msg: "{{ item.Name }}: {{ item.State }}"
    verbosity: 1
  loop: "{{ slack_bot_deploy_compose_result.containers }}"
  loop_control:
    label: "{{ item.Name }}"
  when: not ansible_check_mode
