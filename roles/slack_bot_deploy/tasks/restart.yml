---
- name: Restart | Restart services without pulling
  when: not ansible_check_mode
  block:
    - name: Restart | Write the environment file
      ansible.builtin.import_tasks: env_write.yml

    - name: Restart | Restart the services
      community.docker.docker_compose_v2:
        project_src: "{{ slack_bot_deploy_dir }}"
        files: "{{ __slack_bot_deploy_compose_files }}"
        services: "{{ slack_bot_deploy_services }}"
        state: restarted
        env_files:
          - "{{ __slack_bot_deploy_env_file }}"
      become: true
      no_log: true
  always:
    - name: Restart | Remove the environment file
      ansible.builtin.import_tasks: env_remove.yml
