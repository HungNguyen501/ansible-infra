---
# Tests the file staging and the skills sync. docker compose itself needs a Docker daemon inside the instance, so lint and --check cover that part.
# Platforms, driver and provisioner come from molecule/base.yml at the repository root (make test passes it with -c).
# Run Molecule by hand with: uv run molecule -c ../../molecule/base.yml <command>
provisioner:
  inventory:
    group_vars:
      all:
        slack_bot_deploy_src_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/fixtures"
        slack_bot_deploy_verify_source: false
        slack_bot_deploy_image_repo: example/slack-bot
        slack_bot_deploy_image_tag: v0.0.0
        slack_bot_deploy_secret_env:
          EXAMPLE_SECRET: "line one\nline two"
