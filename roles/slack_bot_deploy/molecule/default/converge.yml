---
- name: Converge
  hosts: all
  tasks:
    - name: Converge | Stage the compose files
      ansible.builtin.import_role:
        name: slack_bot_deploy
        tasks_from: stage.yml

    - name: Converge | Sync the worker skills
      ansible.builtin.import_role:
        name: slack_bot_deploy
        tasks_from: skills.yml

    # The file is written and removed in one run, so the idempotence check would see two changes.
    - name: Converge | Write and remove the compose environment file
      tags: molecule-idempotence-notest
      block:
        - name: Converge | Write the compose environment file
          ansible.builtin.import_role:
            name: slack_bot_deploy
            tasks_from: env_write.yml

        - name: Converge | Stat the environment file
          ansible.builtin.stat:
            path: "{{ __slack_bot_deploy_env_file }}"
          register: slack_bot_deploy_converge_env

        - name: Converge | Assert the environment file is private and holds the values
          ansible.builtin.assert:
            that:
              - slack_bot_deploy_converge_env.stat.exists
              - slack_bot_deploy_converge_env.stat.mode == '0600'
              - slack_bot_deploy_converge_env.stat.pw_name == 'root'

        - name: Converge | Read the environment file
          ansible.builtin.slurp:
            src: "{{ __slack_bot_deploy_env_file }}"
          register: slack_bot_deploy_converge_env_content

        - name: Converge | Assert the multi-line secret is written intact
          ansible.builtin.assert:
            that: "(slack_bot_deploy_converge_env_content.content | b64decode) is search(\"EXAMPLE_SECRET='line one\\nline two'\")"
          no_log: true
      always:
        - name: Converge | Remove the compose environment file
          ansible.builtin.import_role:
            name: slack_bot_deploy
            tasks_from: env_remove.yml

    - name: Converge | Check that the instance has no Docker
      ansible.builtin.command: docker --version
      register: slack_bot_deploy_converge_docker
      failed_when: false
      changed_when: false
      tags: molecule-idempotence-notest

    - name: Converge | Assert Docker is missing, so the failure below has that cause
      ansible.builtin.assert:
        that: slack_bot_deploy_converge_docker.rc != 0
        fail_msg: Docker is installed on the instance, so the compose step would not fail and this test no longer covers the failure path.
      tags: molecule-idempotence-notest

    # No Docker on the test instances, so the compose step of the real entry point fails. Whatever the reason, the
    # always section of compose.yml must still remove the environment directory. verify.yml asserts that nothing is left.
    - name: Converge | Run the production compose entry point with a failing compose step
      tags: molecule-idempotence-notest
      block:
        - name: Converge | Start the services
          ansible.builtin.import_role:
            name: slack_bot_deploy
            tasks_from: compose.yml
      rescue:
        - name: Converge | Assert the compose step is what failed
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Compose | Start the services'
              - ansible_failed_task.action == 'community.docker.docker_compose_v2'
        - name: Converge | Note the expected failure
          ansible.builtin.set_fact:
            slack_bot_deploy_converge_failed_as_expected: true

    - name: Converge | Assert the compose entry point failed
      ansible.builtin.assert:
        that: slack_bot_deploy_converge_failed_as_expected | default(false)
        fail_msg: The compose entry point did not fail. Docker is installed on the instance, so this test no longer covers the failure path.
      tags: molecule-idempotence-notest

    - name: Converge | Refuse values the dotenv format cannot hold
      ansible.builtin.include_tasks: tasks/bad_env.yml
      loop:
        - "it's"
        - "ends with a backslash\\"
        - "carriage\rreturn"
      loop_control:
        loop_var: slack_bot_deploy_probe_value
      tags: molecule-idempotence-notest
