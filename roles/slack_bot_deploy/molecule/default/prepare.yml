---
# Skills that the fixtures do not hold: a file, a directory with a file, and a file inside a directory the source keeps.
# The first converge must delete them all and keep nested/kept.md.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Prepare | Create a stale and a kept skill directory
      ansible.builtin.file:
        path: "/var/workspace/agentic-slack-bot/src/worker/skills/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - removed
        - nested

    - name: Prepare | Create stale skill files
      ansible.builtin.copy:
        content: stale
        dest: "/var/workspace/agentic-slack-bot/src/worker/skills/{{ item }}"
        mode: "0644"
      loop:
        - stale.md
        - removed/SKILL.md
        - nested/old.md
