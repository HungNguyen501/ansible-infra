---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify | Read the compose override
      ansible.builtin.slurp:
        src: /var/workspace/agentic-slack-bot/docker-compose.prod.yml
      register: slack_bot_deploy_verify_override

    - name: Verify | Assert the override holds the image tag
      ansible.builtin.assert:
        that:
          - "'image: example/slack-bot:v0.0.0' in (slack_bot_deploy_verify_override.content | b64decode)"
        fail_msg: docker-compose.prod.yml does not hold the image of the role variables

    - name: Verify | Assert the override drops the bind mount that would hide the skills of the image
      ansible.builtin.assert:
        that:
          - "'volumes: !reset []' in (slack_bot_deploy_verify_override.content | b64decode)"
        fail_msg: The worker would mount an empty skills directory over the skills of the image

    - name: Verify | Stat the staged files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/workspace/agentic-slack-bot/docker-compose.yml
      register: slack_bot_deploy_verify_files

    - name: Verify | Assert the files are in place
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing"
      loop: "{{ slack_bot_deploy_verify_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify | Read the staged files
      ansible.builtin.slurp:
        src: "/var/workspace/agentic-slack-bot/{{ item }}"
      loop:
        - docker-compose.yml
      register: slack_bot_deploy_verify_content

    - name: Verify | Assert the staged files match the source checkout
      ansible.builtin.assert:
        that: (item.content | b64decode) == lookup('ansible.builtin.file', slack_bot_deploy_src_dir ~ '/' ~ item.item, rstrip=false)
        fail_msg: "{{ item.item }} differs from the source checkout"
      loop: "{{ slack_bot_deploy_verify_content.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify | Find environment directories on the host
      ansible.builtin.find:
        paths: /run
        patterns: "slack-bot-deploy-*"
        file_type: directory
      register: slack_bot_deploy_verify_env

    - name: Verify | Assert no environment directory is left, not even the one of a killed run
      ansible.builtin.assert:
        that: slack_bot_deploy_verify_env.matched == 0
        fail_msg: "An environment directory with secrets was left on the host: {{ slack_bot_deploy_verify_env.files | map(attribute='path') | list }}"

# docker compose config needs the Docker CLI, not a running daemon. It parses the file as a deploy would, so this is the
# boundary where a change in the dotenv handling of Compose would change the secret a service receives.
- name: Verify the environment file against docker compose
  hosts: localhost
  gather_facts: false
  vars:
    __slack_bot_deploy_compose_env:
      PLAIN: hello
      MULTILINE: "line one\nline two"
      DOLLAR: "pa$$word${NOPE}"
      BACKSLASH: 'C:\path\x'
      WORKER_COUNT: "3"
  tasks:
    - name: Verify | Make a scratch directory
      ansible.builtin.tempfile:
        state: directory
      register: slack_bot_deploy_verify_scratch

    - name: Verify | Render the file and read it with docker compose
      block:
        - name: Verify | Render the environment file with the role template
          ansible.builtin.template:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/env.j2"
            dest: "{{ slack_bot_deploy_verify_scratch.path }}/compose.env"
            mode: "0600"

        - name: Verify | Write a compose file that uses every value
          ansible.builtin.copy:
            dest: "{{ slack_bot_deploy_verify_scratch.path }}/docker-compose.yml"
            mode: "0600"
            content: |
              services:
                probe:
                  image: busybox
                  environment:
                    PLAIN: ${PLAIN}
                    MULTILINE: ${MULTILINE}
                    DOLLAR: ${DOLLAR}
                    BACKSLASH: ${BACKSLASH}
                  deploy:
                    replicas: ${WORKER_COUNT}

        - name: Verify | Resolve the compose file
          ansible.builtin.command:
            argv:
              # Compose lets exported variables win over --env-file. Unset the probes, so the file alone decides.
              - env
              - -u
              - PLAIN
              - -u
              - MULTILINE
              - -u
              - DOLLAR
              - -u
              - BACKSLASH
              - -u
              - WORKER_COUNT
              - docker
              - compose
              - --env-file
              - "{{ slack_bot_deploy_verify_scratch.path }}/compose.env"
              - -f
              - "{{ slack_bot_deploy_verify_scratch.path }}/docker-compose.yml"
              - config
              - --format
              - json
          changed_when: false
          no_log: true
          register: slack_bot_deploy_verify_config

        # compose config prints a dollar sign as two, so the expected values double theirs.
        - name: Verify | Assert the service receives the original values
          ansible.builtin.assert:
            that:
              - __probe.environment.PLAIN == 'hello'
              - __probe.environment.MULTILINE == 'line one\nline two'
              - __probe.environment.DOLLAR == 'pa$$word${NOPE}' | replace('$', '$$')
              - __probe.environment.BACKSLASH == 'C:\\path\\x'
              - __probe.deploy.replicas | int == 3
          vars:
            __probe: "{{ (slack_bot_deploy_verify_config.stdout | from_json).services.probe }}"
          no_log: true
      always:
        - name: Verify | Remove the scratch directory
          ansible.builtin.file:
            path: "{{ slack_bot_deploy_verify_scratch.path }}"
            state: absent

# The staged override must leave the worker without the skills bind mount of the application compose file, with the real
# merge rules of Compose. The fixture compose file has the same mount as the one of the application.
- name: Verify the override against docker compose
  hosts: localhost
  gather_facts: false
  vars:
    slack_bot_deploy_image_repo: example/slack-bot
    slack_bot_deploy_image_tag: v0.0.0
  tasks:
    - name: Verify | Make a scratch directory
      ansible.builtin.tempfile:
        state: directory
      register: slack_bot_deploy_verify_override_scratch

    - name: Verify | Render the override and merge it with the compose file
      block:
        - name: Verify | Render the override with the role template
          ansible.builtin.template:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/docker-compose.prod.yml.j2"
            dest: "{{ slack_bot_deploy_verify_override_scratch.path }}/docker-compose.prod.yml"
            mode: "0600"

        - name: Verify | Resolve the compose file with the override
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - -f
              - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/fixtures/docker-compose.yml"
              - -f
              - "{{ slack_bot_deploy_verify_override_scratch.path }}/docker-compose.prod.yml"
              - config
              - --format
              - json
          changed_when: false
          register: slack_bot_deploy_verify_merged

        - name: Verify | Resolve the compose file without the override
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - -f
              - "{{ lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY') }}/fixtures/docker-compose.yml"
              - config
              - --format
              - json
          changed_when: false
          register: slack_bot_deploy_verify_plain

        - name: Verify | Assert the fixture has the mount and the override removes only that
          ansible.builtin.assert:
            that:
              - __plain.worker.volumes | map(attribute='target') | list == ['/app/worker/skills']
              - __merged.worker.volumes is not defined or __merged.worker.volumes | length == 0
              - __merged.worker.image == 'example/slack-bot:v0.0.0'
              - __merged.receiver.image == 'example/slack-bot:v0.0.0'
          vars:
            __plain: "{{ (slack_bot_deploy_verify_plain.stdout | from_json).services }}"
            __merged: "{{ (slack_bot_deploy_verify_merged.stdout | from_json).services }}"
      always:
        - name: Verify | Remove the scratch directory
          ansible.builtin.file:
            path: "{{ slack_bot_deploy_verify_override_scratch.path }}"
            state: absent
