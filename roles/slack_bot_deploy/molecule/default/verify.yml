---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify | Read the compose override
      ansible.builtin.slurp:
        src: /var/workspace/agentic-slack-bot/docker-compose.prod.yml
      register: slack_bot_deploy_verify_override

    - name: Verify | Assert the override holds the image tag
      ansible.builtin.assert:
        that:
          - "'image: example/slack-bot:v0.0.0' in (slack_bot_deploy_verify_override.content | b64decode)"
        fail_msg: docker-compose.prod.yml does not hold the image of the role variables

    - name: Verify | Stat the staged files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/workspace/agentic-slack-bot/docker-compose.yml
        - /var/workspace/agentic-slack-bot/src/worker/skills/example.md
        - /var/workspace/agentic-slack-bot/src/worker/skills/nested/kept.md
      register: slack_bot_deploy_verify_files

    - name: Verify | Assert the files are in place
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "{{ item.item }} is missing"
      loop: "{{ slack_bot_deploy_verify_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify | Stat the stale skills
      ansible.builtin.stat:
        path: "/var/workspace/agentic-slack-bot/src/worker/skills/{{ item }}"
      loop:
        - stale.md
        - removed
        - nested/old.md
      register: slack_bot_deploy_verify_stale

    - name: Verify | Assert the stale skills are gone
      ansible.builtin.assert:
        that: not item.stat.exists
        fail_msg: "{{ item.item }} survived the skills sync"
      loop: "{{ slack_bot_deploy_verify_stale.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify | Read the staged files
      ansible.builtin.slurp:
        src: "/var/workspace/agentic-slack-bot/{{ item }}"
      loop:
        - docker-compose.yml
        - src/worker/skills/example.md
        - src/worker/skills/nested/kept.md
      register: slack_bot_deploy_verify_content

    - name: Verify | Assert the staged files match the source checkout
      ansible.builtin.assert:
        that: (item.content | b64decode) == lookup('ansible.builtin.file', slack_bot_deploy_src_dir ~ '/' ~ item.item, rstrip=false)
        fail_msg: "{{ item.item }} differs from the source checkout"
      loop: "{{ slack_bot_deploy_verify_content.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify | Find environment directories on the host
      ansible.builtin.find:
        paths: /run
        patterns: "slack-bot-deploy-*"
        file_type: directory
      register: slack_bot_deploy_verify_env

    - name: Verify | Assert no environment directory is left, not even the one of a killed run
      ansible.builtin.assert:
        that: slack_bot_deploy_verify_env.matched == 0
        fail_msg: "An environment directory with secrets was left on the host: {{ slack_bot_deploy_verify_env.files | map(attribute='path') | list }}"

    - name: Verify | Stat the entries whose type changed
      ansible.builtin.stat:
        path: "/var/workspace/agentic-slack-bot/src/worker/skills/{{ item }}"
      loop:
        - swap
        - swap/inside.md
        - flat.md
      register: slack_bot_deploy_verify_swap

    - name: Verify | Assert swap became a directory and flat.md a file
      ansible.builtin.assert:
        that:
          - slack_bot_deploy_verify_swap.results[0].stat.isdir
          - slack_bot_deploy_verify_swap.results[1].stat.isreg
          - slack_bot_deploy_verify_swap.results[2].stat.isreg
        fail_msg: A skill whose type changed between file and directory was not replaced

# docker compose config needs the Docker CLI, not a running daemon. It parses the file as a deploy would, so this is the
# boundary where a change in the dotenv handling of Compose would change the secret a service receives.
- name: Verify the environment file against docker compose
  hosts: localhost
  gather_facts: false
  vars:
    __slack_bot_deploy_compose_env:
      PLAIN: hello
      MULTILINE: "line one\nline two"
      DOLLAR: "pa$$word${NOPE}"
      BACKSLASH: 'C:\path\x'
      WORKER_COUNT: "3"
  tasks:
    - name: Verify | Make a scratch directory
      ansible.builtin.tempfile:
        state: directory
      register: slack_bot_deploy_verify_scratch

    - name: Verify | Render the file and read it with docker compose
      block:
        - name: Verify | Render the environment file with the role template
          ansible.builtin.template:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/templates/env.j2"
            dest: "{{ slack_bot_deploy_verify_scratch.path }}/compose.env"
            mode: "0600"

        - name: Verify | Write a compose file that uses every value
          ansible.builtin.copy:
            dest: "{{ slack_bot_deploy_verify_scratch.path }}/docker-compose.yml"
            mode: "0600"
            content: |
              services:
                probe:
                  image: busybox
                  environment:
                    PLAIN: ${PLAIN}
                    MULTILINE: ${MULTILINE}
                    DOLLAR: ${DOLLAR}
                    BACKSLASH: ${BACKSLASH}
                  deploy:
                    replicas: ${WORKER_COUNT}

        - name: Verify | Resolve the compose file
          ansible.builtin.command:
            argv:
              # Compose lets exported variables win over --env-file. Unset the probes, so the file alone decides.
              - env
              - -u
              - PLAIN
              - -u
              - MULTILINE
              - -u
              - DOLLAR
              - -u
              - BACKSLASH
              - -u
              - WORKER_COUNT
              - docker
              - compose
              - --env-file
              - "{{ slack_bot_deploy_verify_scratch.path }}/compose.env"
              - -f
              - "{{ slack_bot_deploy_verify_scratch.path }}/docker-compose.yml"
              - config
              - --format
              - json
          changed_when: false
          no_log: true
          register: slack_bot_deploy_verify_config

        # compose config prints a dollar sign as two, so the expected values double theirs.
        - name: Verify | Assert the service receives the original values
          ansible.builtin.assert:
            that:
              - __probe.environment.PLAIN == 'hello'
              - __probe.environment.MULTILINE == 'line one\nline two'
              - __probe.environment.DOLLAR == 'pa$$word${NOPE}' | replace('$', '$$')
              - __probe.environment.BACKSLASH == 'C:\\path\\x'
              - __probe.deploy.replicas | int == 3
          vars:
            __probe: "{{ (slack_bot_deploy_verify_config.stdout | from_json).services.probe }}"
          no_log: true
      always:
        - name: Verify | Remove the scratch directory
          ansible.builtin.file:
            path: "{{ slack_bot_deploy_verify_scratch.path }}"
            state: absent

# preflight.yml reads git, and the test fixtures are not a repository, so it gets a scratch one. Untracked and ignored
# files are in the working tree that copy sends to the workers, so each of them must stop the deploy.
- name: Verify the preflight of the source checkout
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Verify | Make a scratch directory
      ansible.builtin.tempfile:
        state: directory
      register: slack_bot_deploy_verify_scratch

    - name: Verify | Build a repository with a tagged commit
      block:
        - name: Verify | Create the skills directory
          ansible.builtin.file:
            path: "{{ slack_bot_deploy_verify_scratch.path }}/src/worker/skills"
            state: directory
            mode: "0755"

        - name: Verify | Write the tracked files
          ansible.builtin.copy:
            dest: "{{ slack_bot_deploy_verify_scratch.path }}/{{ item.path }}"
            content: "{{ item.content }}"
            mode: "0644"
          loop:
            - {path: docker-compose.yml, content: "services: {}\n"}
            - {path: src/worker/skills/tracked.md, content: "tracked\n"}
            - {path: .gitignore, content: "src/worker/skills/ignored.md\n"}

        - name: Verify | Commit them
          ansible.builtin.command:
            argv: "{{ item }}"
            chdir: "{{ slack_bot_deploy_verify_scratch.path }}"
          loop:
            - [git, init, -q, .]
            - [git, add, -A]
            - [git, -c, user.name=t, -c, user.email=t@t, commit, -q, -m, base]
          changed_when: true

        - name: Verify | Read the commit
          ansible.builtin.command:
            argv: [git, rev-parse, --short=7, HEAD]
            chdir: "{{ slack_bot_deploy_verify_scratch.path }}"
          changed_when: false
          register: slack_bot_deploy_verify_short

        - name: Verify | Run the cases
          ansible.builtin.include_tasks: tasks/preflight_case.yml
          loop:
            - {file: "", expect: ""}
            - {file: untracked.md, expect: "Preflight | Assert the compose file and skills have no local edits"}
            - {file: ignored.md, expect: "Preflight | Assert the compose file and skills have no local edits"}
          loop_control:
            loop_var: case
          vars:
            slack_bot_deploy_verify_repo: "{{ slack_bot_deploy_verify_scratch.path }}"
            slack_bot_deploy_verify_tag: "v2026.01.01.{{ slack_bot_deploy_verify_short.stdout }}"
            case_file: "{{ case.file }}"
            case_expect_task: "{{ case.expect }}"
      always:
        - name: Verify | Remove the scratch directory
          ansible.builtin.file:
            path: "{{ slack_bot_deploy_verify_scratch.path }}"
            state: absent
