---
# Internal values. Callers do not override these; tunables belong in defaults/main.yml.
__slack_bot_deploy_compose_files:
  - docker-compose.yml
  - docker-compose.prod.yml

__slack_bot_deploy_compose_file_args:
  - -f
  - docker-compose.yml
  - -f
  - docker-compose.prod.yml

# Environment handed to docker compose for ${NAME} interpolation. It never lands in a file on the host.
__slack_bot_deploy_compose_env: >-
  {{ slack_bot_deploy_env
  | combine(slack_bot_deploy_secret_env, {'WORKER_COUNT': slack_bot_deploy_worker_count | string}) }}
