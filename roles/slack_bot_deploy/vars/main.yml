---
# Internal values. Callers do not override these; tunables belong in defaults/main.yml.
__slack_bot_deploy_compose_files:
  - docker-compose.yml
  - docker-compose.prod.yml

__slack_bot_deploy_compose_file_args:
  - -f
  - docker-compose.yml
  - -f
  - docker-compose.prod.yml

# Environment handed to docker compose for ${NAME} interpolation. The env_write.yml task puts it in the file below for the
# length of one compose call. /run is tmpfs, so the secrets never reach the disk and a file left by a killed run is gone at reboot.
__slack_bot_deploy_env_dir: /run/slack-bot-deploy
__slack_bot_deploy_env_file: /run/slack-bot-deploy/compose.env

__slack_bot_deploy_compose_env: >-
  {{ slack_bot_deploy_env
  | combine(slack_bot_deploy_secret_env, {'WORKER_COUNT': slack_bot_deploy_worker_count | string}) }}
